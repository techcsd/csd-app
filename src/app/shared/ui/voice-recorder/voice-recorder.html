@if (mode() === 'push') {
  <!-- AX2 — barra de grabación tipo WhatsApp (un solo estado): cancelar · punto
       rojo + waveform reactivo + timer · enviar. Iconos SVG (AW12), sin emojis. -->
  <div class="voice voice--push">
    <button type="button" class="voice__cancel" (click)="cancelar()" aria-label="Cancelar grabación">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5"/><path d="M14 11v5"/>
      </svg>
    </button>

    <div class="voice__meter" [class.voice__meter--pulse]="sinNivel()" role="status" aria-label="Grabando nota de voz">
      <span class="voice__dot"></span>
      <div class="voice__bars">
        @for (b of bars; track b) {
          <span class="voice__bar" [style.transform]="'scaleY(' + (sinNivel() ? 0.4 : (0.08 + niveles()[b])) + ')'"></span>
        }
      </div>
      <span class="voice__time">{{ tiempo() }}</span>
    </div>

    <button type="button" class="voice__send" (click)="enviarNota()" aria-label="Enviar nota de voz">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/>
      </svg>
    </button>
  </div>
} @else {
  <!-- Modo 'toggle' (voice-notes): grabar/detener + vista previa. Icono SVG (AW12). -->
  <div class="voice">
    @if (previewUrl(); as url) {
      <audio class="voice__audio" [src]="url" controls></audio>
      <button type="button" class="btn-ghost voice__clear" (click)="clear()">Repetir nota</button>
    } @else {
      <button
        type="button"
        class="voice__btn"
        [class.voice__btn--rec]="recording()"
        (click)="toggle()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          @if (recording()) {
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          } @else {
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
            <path d="M19 12a7 7 0 0 1-6 6.92V22h-2v-3.08A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0h2z"/>
          }
        </svg>
        {{ recording() ? 'Detener grabación' : 'Grabar nota de voz' }}
      </button>
      @if (recording()) {
        <div class="voice__meter" [class.voice__meter--pulse]="sinNivel()" role="status" aria-label="Grabando nota de voz">
          <span class="voice__dot"></span>
          <div class="voice__bars">
            @for (b of bars; track b) {
              <span class="voice__bar" [style.transform]="'scaleY(' + (sinNivel() ? 0.4 : (0.08 + niveles()[b])) + ')'"></span>
            }
          </div>
          <span class="voice__time">{{ tiempo() }}</span>
        </div>
      }
    }
  </div>
}
