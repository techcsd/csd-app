<div class="vcard" [class.vcard--on]="selected()" [class.vcard--done]="done()">
  <div class="vcard__foto">
    <app-img [src]="fotoUrl()" [alt]="'Foto de ' + placa()" fallback="🚙" />
  </div>
  <div class="vcard__info">
    <span class="vcard__placa">
      {{ titulo() || ('Vehículo' | t) }}@if (anio()) { <span class="vcard__anio">{{ anio() }}</span> }
      @if (esPrueba()) { <span class="vcard__prueba">{{ 'PRUEBA' | t }}</span> }
    </span>
    <span class="vcard__meta">{{ tipoLabel() || ('Vehículo' | t) }} · {{ km() ?? 0 | number: '1.0-0' }} km</span>
    @if (subId()) {
      <span class="vcard__sub">{{ subId() }}</span>
    }
  </div>
  <div class="vcard__trailing">
    <ng-content />
  </div>
</div>
