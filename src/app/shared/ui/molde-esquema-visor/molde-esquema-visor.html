@if (open()) {
  <div class="mev" (click)="close()">
    <button type="button" class="mev__close" (click)="close()" [attr.aria-label]="'Cerrar' | t">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
    <div class="mev__panel" (click)="$event.stopPropagation()">
      <app-molde-esquema [forma]="forma()" [tramos]="tramos()" [medidaPlano]="medidaPlano()" [toleranciaCm]="toleranciaCm()" />
    </div>
  </div>
}
