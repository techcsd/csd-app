<div class="vplayer">
  <button
    type="button"
    class="vplayer__btn"
    (click)="toggle()"
    [attr.aria-label]="playing() ? 'Pausar' : 'Reproducir'"
  >
    @if (playing()) {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1" />
        <rect x="14" y="5" width="4" height="14" rx="1" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M8 5v14l11-7z" />
      </svg>
    }
  </button>

  <div class="vplayer__track" role="progressbar" [attr.aria-valuenow]="progreso()">
    <div class="vplayer__fill" [style.width.%]="progreso()"></div>
  </div>

  <span class="vplayer__time">{{ etiquetaTiempo() }}</span>

  <button
    type="button"
    class="vplayer__speed"
    (click)="ciclarVelocidad()"
    [attr.aria-label]="'Velocidad ' + velocidad() + 'x'"
  >
    {{ velocidad() }}×
  </button>

  <audio
    #el
    [src]="src()"
    preload="none"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
    (timeupdate)="onTime()"
    (loadedmetadata)="onMeta()"
  ></audio>
</div>
