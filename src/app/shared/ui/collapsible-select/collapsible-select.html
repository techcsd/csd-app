<!-- AO — el trigger/chip queda SIEMPRE inline (compacto); la lista sale en la hoja
     modal, sin empujar el flujo de la página. -->
<div class="colsel">
  @if (label()) { <span class="colsel__label">{{ label() }}</span> }
  @if (seleccionado(); as sel) {
    <div class="colsel__chip">
      <span class="colsel__icon">{{ sel.icon || icon() }}</span>
      <span class="colsel__name">{{ sel.label }}</span>
      <button type="button" class="colsel__cambiar" (click)="cambiar()">{{ cambiarLabel() }}</button>
    </div>
  } @else {
    <button type="button" class="colsel__trigger" (click)="abrir()">
      <span class="colsel__icon">{{ icon() }}</span>
      <span class="colsel__placeholder">{{ triggerLabel() }}</span>
      <span class="colsel__chevron" aria-hidden="true">▾</span>
    </button>
  }
</div>

<!-- AO — hoja inferior deslizable con la lista; elegir cierra la hoja. -->
<app-bottom-sheet [open]="abierto()" [titulo]="tituloSheet()" (closed)="cerrarSheet()">
  <app-select-list
    [icon]="icon()"
    [options]="options()"
    [selectedId]="selectedId()"
    [searchable]="searchable()"
    [searchPlaceholder]="searchPlaceholder()"
    (picked)="onPicked($event)"
  />
</app-bottom-sheet>
