@if (activa()) {
  <div class="alarma" role="alertdialog" aria-label="Alarma del reporte semanal">
    <div class="alarma__pulse" aria-hidden="true">⏰</div>
    <h1 class="alarma__title">{{ 'Reporte semanal pendiente' | t }}</h1>
    <p class="alarma__msg">
      {{ 'Hoy es domingo y aún no has hecho el reporte semanal de tu vehículo. Hazlo ahora para que Flota sepa cómo está.' | t }}
    </p>
    <button type="button" class="btn-cta alarma__cta" (click)="hacerReporte()">{{ 'Hacer reporte ahora' | t }}</button>
    <button type="button" class="btn-ghost alarma__snooze" (click)="posponer()">{{ 'Posponer 1 hora' | t }}</button>
  </div>
}
