<div class="screen home">
  <header class="home__header">
    <div>
      <p class="home__greeting">Hola, {{ nombre() }} 👷</p>
      @if (obra(); as o) {
        <p class="home__obra">Obra: {{ o.nombre }}</p>
      }
    </div>
    <div class="home__header-actions">
      <button type="button" class="home__bell" (click)="avisos()" aria-label="Avisos">
        🔔
        @if (avisosNoLeidos() > 0) {
          <span class="home__bell-badge">{{ avisosNoLeidos() > 9 ? '9+' : avisosNoLeidos() }}</span>
        }
      </button>
      <button type="button" class="home__logout" (click)="perfil()" aria-label="Mi perfil" data-tour="perfil">⚙️ Perfil</button>
    </div>
  </header>

  <!-- AE — firmas de recepción pendientes asignadas a mí -->
  @if (firmasPendientes() > 0) {
    <button type="button" class="home__firmar" (click)="irPorFirmar()">
      <span class="home__firmar-icon">✍️</span>
      <span class="home__firmar-txt">
        Tienes {{ firmasPendientes() }} {{ firmasPendientes() === 1 ? 'entrega' : 'entregas' }} por firmar
      </span>
      <span class="home__firmar-go">›</span>
    </button>
  }

  <main class="home__grid" data-tour="tiles">
    @for (tile of tiles(); track tile.modulo) {
      <app-big-button
        [icon]="tile.icon"
        [label]="tile.label"
        [tint]="tile.tint"
        [badge]="badgeFor(tile.modulo)"
        (pressed)="open(tile)"
      />
    } @empty {
      <app-empty-state
        icon="🔑"
        title="Sin módulos asignados"
        message="Tu usuario todavía no tiene módulos habilitados en la app. Escríbenos y administración te dará acceso."
        ctaLabel="Reportar / pedir acceso"
        (action)="reportar()"
      />
    }
  </main>

  <!-- Non-gated: available to everyone. -->
  <footer class="home__footer">
    <!-- AA6/AA7 — Dudas y Visitar web en la misma línea (ocupan menos espacio). -->
    <div class="home__links-row">
      <button type="button" class="home__link" (click)="dudas()">❓ Dudas y guías</button>
      <button type="button" class="home__link" (click)="visitarWeb()">🌐 Visitar web</button>
    </div>
    <button type="button" class="home__report" (click)="reportar()" data-tour="reportar">
      🛟 Reportar un problema o mejora
    </button>
  </footer>

  <app-sync-bar data-tour="sync" />

  <app-onboarding />
</div>
