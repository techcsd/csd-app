<div class="screen avisos">
  <header class="avisos__header">
    <button type="button" class="avisos__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="avisos__icon">🔔</span>
    <h1 class="avisos__title">Avisos</h1>
    @if (hayNoLeidos) {
      <button type="button" class="avisos__todas" (click)="marcarTodas()">Marcar leídos</button>
    }
    <!-- AT23 — preferencias: silenciar categorías informativas -->
    <button type="button" class="avisos__refresh" (click)="abrirPrefs()" aria-label="Preferencias de avisos">⚙️</button>
    <button type="button" class="avisos__refresh" (click)="refrescar()" [disabled]="refrescando()" aria-label="Actualizar">{{ refrescando() ? '…' : '🔄' }}</button>
  </header>

  <div class="screen__body" appLiveRefresh (appLiveRefresh)="refrescar($event)">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else {
      @if (avisos().length) {
        <button type="button" class="avisos__borrar-todas" (click)="pedirBorrarTodas()">
          🗑️ Borrar todas
        </button>
      }
      @for (n of avisos(); track n.id) {
        <div class="aviso" [class.aviso--unread]="!n.leida">
          <button type="button" class="aviso__main" (click)="abrir(n)">
            @if (!n.leida) { <span class="aviso__dot"></span> }
            <span class="aviso__icon">{{ iconFor(n.tipo) }}</span>
            <span class="aviso__body">
              <span class="aviso__titulo">{{ n.titulo }}</span>
              @if (n.mensaje) { <span class="aviso__msg">{{ n.mensaje }}</span> }
              <span class="aviso__fecha">{{ fechaHora(n.created_at) }}</span>
            </span>
            @if (tieneDestino(n)) { <span class="aviso__go">›</span> }
          </button>
          <button
            type="button"
            class="aviso__del"
            (click)="eliminar(n, $event)"
            aria-label="Eliminar aviso"
          >
            🗑️
          </button>
        </div>
      } @empty {
        <app-empty-state
          icon="🔔"
          title="No tienes avisos"
          message="Aquí te aparecen los avisos: firmas pendientes, confirmaciones y novedades que te toquen."
          secondaryLabel="Actualizar"
          (secondaryAction)="load()"
        />
      }
    }
  </div>

  <app-confirm-dialog
    [open]="confirmBorrarTodas()"
    title="¿Borrar todos los avisos?"
    message="Se eliminarán todos tus avisos. Esta acción no se puede deshacer."
    confirmLabel="Sí, borrar todas"
    cancelLabel="Cancelar"
    tone="danger"
    (confirmed)="borrarTodas()"
    (cancelled)="cancelarBorrarTodas()"
  />

  <!-- AT23 — hoja de preferencias de avisos (silenciar categorías informativas) -->
  <app-bottom-sheet [open]="prefsAbierto()" titulo="Preferencias de avisos" (closed)="cerrarPrefs()">
    <div class="avisos-prefs">
      <p class="avisos-prefs__intro">Elige qué avisos quieres recibir en la app. Los que apagues dejan de aparecer aquí (no afectan a los demás).</p>
      @for (c of categorias; track c.tipo) {
        <app-toggle-switch [checked]="recibe(c.tipo)" [label]="c.label" (checkedChange)="onTogglePref(c.tipo, $event)" />
      }
    </div>
  </app-bottom-sheet>
</div>
