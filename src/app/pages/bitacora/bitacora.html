<div class="screen bitacora">
  <header class="bitacora__header">
    <button type="button" class="bitacora__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="bitacora__icon">📓</span>
    <h1 class="bitacora__title">{{ 'Bitácora' | t }}</h1>
  </header>

  <div class="screen__body">
    <button type="button" class="bit-action bit-action--primary" (click)="go('/bitacora/parte')">
      <span class="bit-action__icon">📝</span>
      <span class="bit-action__label">{{ 'Nueva bitácora del día' | t }}</span>
    </button>
    <button type="button" class="bit-action bit-action--danger" (click)="go('/bitacora/incidente')">
      <span class="bit-action__icon">🚨</span>
      <span class="bit-action__label">{{ 'Reportar incidente' | t }}</span>
    </button>
    <button type="button" class="bit-action bit-action--primary" (click)="go('/bitacora/liberacion')">
      <span class="bit-action__icon">✅</span>
      <span class="bit-action__label">{{ 'Checklist de liberación (CL)' | t }}</span>
    </button>
    <button type="button" class="bit-action" (click)="go('/bitacora/orden-trabajo')">
      <span class="bit-action__icon">🧾</span>
      <span class="bit-action__label">{{ 'Orden de trabajo' | t }}</span>
    </button>
    <!-- BW1 — ver / compartir las órdenes creadas -->
    <button type="button" class="bit-action" (click)="go('/bitacora/mis-ordenes')">
      <span class="bit-action__icon">🗂️</span>
      <span class="bit-action__label">{{ 'Mis órdenes de trabajo' | t }}</span>
    </button>
    <button type="button" class="bit-action" (click)="go('/bitacora/cl')">
      <span class="bit-action__icon">✍️</span>
      <span class="bit-action__label">{{ 'Liberaciones por firmar' | t }}</span>
    </button>
    <button type="button" class="bit-action" (click)="go('/bitacora/mis-partes')">
      <span class="bit-action__icon">📋</span>
      <span class="bit-action__label">{{ 'Mis bitácoras' | t }}</span>
    </button>
    @if (enProcesoCount()['bitacora']; as n) {
      <button type="button" class="bit-action" (click)="go('/en-proceso')">
        <span class="bit-action__icon">📥</span>
        <span class="bit-action__label">{{ 'Documentación en proceso' | t }} ({{ n }})</span>
      </button>
    }
  </div>

  <app-sync-bar />
</div>
