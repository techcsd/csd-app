<div class="screen pin-screen">
  <header class="pin-screen__header">
    <button type="button" class="pin-screen__back" (click)="back()" aria-label="Atrás">←</button>
  </header>
  <div class="pin-screen__body">
    <h1 class="pin-screen__title">
      {{ step() === 'actual' ? 'Tu PIN actual' : step() === 'nuevo' ? 'Nuevo PIN' : 'Repite el nuevo PIN' }}
    </h1>
    <p class="pin-screen__hint">
      {{ step() === 'actual'
        ? 'Escribe tu PIN actual para confirmar que eres tú.'
        : step() === 'nuevo'
          ? 'Elige 4 números nuevos para desbloquear la app.'
          : 'Escríbelo otra vez para confirmar.' }}
    </p>
    <app-pin-pad [(value)]="value" (completed)="onCompleted($event)" />
  </div>
</div>
