<div class="screen pin-screen">
  <div class="pin-screen__body">
    <h1 class="pin-screen__title">Escribe tu PIN</h1>
    <p class="pin-screen__hint">Para entrar a la app.</p>
    @if (attemptsLeft() < 5) {
      <p class="pin-screen__attempts">Te quedan {{ attemptsLeft() }} intento(s).</p>
    }
    <app-pin-pad [(value)]="value" (completed)="onCompleted($event)" />
    @if (biometriaDisponible()) {
      <button type="button" class="pin-screen__bio" (click)="unlockConHuella()">
        👆 Usar huella / rostro
      </button>
    }
    @if (faceIdDisponible()) {
      <button type="button" class="pin-screen__bio" (click)="unlockConFaceId()">
        🙂 Desbloquear con Face ID
      </button>
    }
    <button type="button" class="pin-screen__forgot" (click)="olvidePin()">
      ¿Olvidaste tu PIN?
    </button>
  </div>

  <app-confirm-dialog
    [open]="confirmReset()"
    title="Restablecer tu PIN"
    message="Cerraremos tu sesión y entrarás de nuevo con tu contraseña (o cédula + PIN de acceso). Luego crearás un PIN nuevo. Necesitas internet."
    confirmLabel="Entrar de nuevo"
    cancelLabel="Cancelar"
    (confirmed)="confirmarReset()"
    (cancelled)="cancelarReset()"
  />
</div>
