<div class="screen login">
  <div class="login__brand">
    <div class="login__logo">CSD</div>
    <h1 class="login__title">CSD App</h1>
    <p class="login__tagline">Constructora SD — App de campo</p>
  </div>

  <!-- P5 — elegir vía de acceso -->
  <div class="login__tabs" role="tablist">
    <button
      type="button"
      class="login__tab"
      [class.login__tab--on]="modo() === 'correo'"
      (click)="setModo('correo')"
    >
      Con correo
    </button>
    <button
      type="button"
      class="login__tab"
      [class.login__tab--on]="modo() === 'conductor'"
      (click)="setModo('conductor')"
    >
      Soy conductor
    </button>
  </div>

  @if (modo() === 'correo') {
    <form class="login__form" (ngSubmit)="submit()">
      <label class="field-label" for="email">Correo</label>
      <input
        id="email"
        class="field"
        type="email"
        inputmode="email"
        autocomplete="username"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        placeholder="tucorreo@constructorasd.com"
      />

      <label class="field-label" for="password">Contraseña</label>
      <div class="login__field-wrap">
        <input
          id="password"
          class="field login__input--toggle"
          [type]="verPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
        <button
          type="button"
          class="login__eye"
          (click)="verPassword.set(!verPassword())"
          [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="verPassword()"
        >
          @if (verPassword()) {
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>

      <button type="submit" class="btn-cta login__submit" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>

      <a class="login__forgot" routerLink="/auth/reset">Olvidé mi contraseña</a>
    </form>
  } @else {
    <form class="login__form" (ngSubmit)="submitConductor()">
      <label class="field-label" for="cedula">Cédula</label>
      <input
        id="cedula"
        class="field"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="13"
        [ngModel]="cedula()"
        (ngModelChange)="onCedulaInput($event)"
        name="cedula"
        placeholder="000-0000000-0"
      />

      <label class="field-label" for="pin">PIN de acceso</label>
      <input
        id="pin"
        class="field login__pin"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        maxlength="6"
        [ngModel]="pin()"
        (ngModelChange)="pin.set($event)"
        name="pin"
        placeholder="••••••"
      />

      <button type="submit" class="btn-cta login__submit" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>

      <p class="login__hint">
        ¿No tienes acceso? Pídele a administración que te lo genere desde tu perfil de conductor.
      </p>
    </form>
  }
</div>
