<div class="screen charla">
  <app-wizard-exit [title]="'Charla de seguridad' | t" (exit)="pedirSalir()" />

  @if (done()) {
    <app-big-confirm
      [title]="'Charla registrada' | t"
      [note]="network.online() ? ('Guardada.' | t) : ('Guardada. Se enviará cuando tengas señal.' | t)"
      tone="done"
      [buttonLabel]="'Listo' | t"
      (dismissed)="cerrar()"
    />
  } @else {
    <div class="screen__body charla__body">
      @if (borradorPrevio()) {
        <div class="charla__draft">📝 {{ 'Recuperamos un borrador sin terminar.' | t }}</div>
      }

      <label class="field-label">{{ 'Tema de la charla' | t }}</label>
      <input class="field" type="text" [ngModel]="tema()" (ngModelChange)="tema.set($event)"
        [placeholder]="'Ej.: Uso de arnés en alturas' | t" />

      <label class="field-label charla__mt">{{ 'Duración' | t }}</label>
      <app-counter [label]="'Minutos' | t" icon="⏱️" [(value)]="duracion" [min]="1" [max]="60" />

      <label class="field-label charla__mt">{{ 'Asistentes' | t }}</label>
      <app-counter [label]="'Personas' | t" icon="👥" [(value)]="asistentes" [min]="0" [max]="200" />

      <label class="field-label charla__mt">{{ 'Notas (opcional)' | t }}</label>
      <textarea class="field" rows="2" [ngModel]="notas()" (ngModelChange)="notas.set($event)"
        [placeholder]="'Puntos tratados…' | t"></textarea>

      <label class="field-label charla__mt">{{ 'Foto del grupo' | t }}</label>
      <div class="charla__fotos">
        @for (i of slots; track i) {
          <app-photo-slot [label]="('Foto' | t) + ' ' + (i + 1)" hint="📸" [gallery]="false"
            [foto]="fotos()[i] ?? null" (captured)="onFoto(i, $event)" (cleared)="onFotoCleared(i)" />
        }
      </div>

      <label class="charla__firma-toggle">
        <input type="checkbox" [ngModel]="firmando()" (ngModelChange)="firmando.set($event)" />
        {{ 'Firmar (encargado)' | t }}
      </label>
      @if (firmando()) {
        <app-signature-pad />
      }

      <button type="button" class="btn-cta charla__guardar" [disabled]="!puedeGuardar() || submitting()" (click)="guardar()">
        {{ submitting() ? ('Guardando…' | t) : ('Guardar charla' | t) }}
      </button>
      @if (!puedeGuardar()) {
        <p class="charla__hint">{{ 'Escribe el tema y toma al menos una foto del grupo.' | t }}</p>
      }
    </div>
  }

  <app-confirm-dialog
    [open]="confirmSalir()"
    [title]="'¿Salir sin guardar?' | t"
    [message]="'Tu borrador queda guardado; puedes continuarlo luego.' | t"
    [confirmLabel]="'Salir' | t"
    [cancelLabel]="'Seguir aquí' | t"
    (confirmed)="salir()"
    (cancelled)="cancelarSalir()"
  />
</div>
