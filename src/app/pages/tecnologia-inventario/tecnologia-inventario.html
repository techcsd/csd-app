<div class="screen tecinv">
  <header class="tecinv__header">
    <button type="button" class="tecinv__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="tecinv__icon">💻</span>
    <h1 class="tecinv__title">Inventario tecnológico</h1>
  </header>

  <div class="screen__body">
    <input
      class="field tecinv__buscar"
      type="search"
      [ngModel]="busqueda()"
      (ngModelChange)="busqueda.set($event)"
      placeholder="Buscar por nombre, código, serie…"
      aria-label="Buscar equipo"
    />
    <div class="tecinv__filtros">
      <app-collapsible-select label="Tipo" icon="🏷️" [options]="tipoOptions()" [selectedId]="tipoFiltro()" [searchable]="true" (picked)="tipoFiltro.set($event)" />
      <app-collapsible-select label="Estado" icon="📍" [options]="estadoOptions()" [selectedId]="estadoFiltro()" (picked)="estadoFiltro.set($event)" />
    </div>

    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else if (!filtrados().length) {
      <app-empty-state icon="💻" title="Sin equipos" message="Agrega el primer equipo tecnológico con el botón +." />
    } @else {
      <div class="tecinv__list">
        @for (e of filtrados(); track e.id) {
          <button type="button" class="tecinv-card" (click)="abrir(e)">
            <app-img class="tecinv-card__img" [src]="portadaOf(e)" ratio="1 / 1" fallback="💻" fit="cover" [alt]="e.nombre" />
            <div class="tecinv-card__info">
              <span class="tecinv-card__nombre">{{ e.nombre }}</span>
              <span class="tecinv-card__meta">{{ tipoLabel(e.tipo_id) }} @if (e.codigo) { · {{ e.codigo }} }</span>
              <span class="tecinv-card__estado tecinv-card__estado--{{ e.estado }}">{{ estadoDe(e) }}</span>
            </div>
          </button>
        }
      </div>
    }
  </div>

  <button type="button" class="tecinv__fab" (click)="nuevo()" aria-label="Nuevo equipo">➕</button>
</div>
