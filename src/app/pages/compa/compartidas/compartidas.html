<div class="screen">
  <header class="cs-header">
    <button type="button" class="cs-header__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="cs-header__icon">📨</span>
    <h1 class="cs-header__title">{{ 'Compartidas conmigo' | t }}</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else {
      @if (error()) { <div class="cs-band cs-band--err">{{ error() }}</div> }

      @for (c of compartidas(); track c.id) {
        <button type="button" class="cs-card" [class.cs-card--nueva]="!c.vista_at" (click)="abrir(c)">
          @if (!c.vista_at) { <span class="cs-card__dot" aria-hidden="true"></span> }
          <div class="cs-card__main">
            <span class="cs-card__titulo">{{ c.titulo || ('Una conversación con Compa' | t) }}</span>
            <span class="cs-card__meta">{{ c.compartida_por_nombre || ('Alguien' | t) }} · {{ fmtFecha(c.created_at) }}</span>
            @if (c.mensaje) { <span class="cs-card__mensaje">"{{ c.mensaje }}"</span> }
          </div>
          <span class="cs-card__chevron" aria-hidden="true">›</span>
        </button>
      } @empty {
        @if (!error()) {
          <app-empty-state icon="📨" [title]="'Nadie te ha compartido nada' | t"
            [message]="'Cuando alguien comparta contigo una conversación con Compa, aparecerá aquí.' | t" />
        }
      }
    }
  </div>
</div>
