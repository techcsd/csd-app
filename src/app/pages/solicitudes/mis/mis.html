<div class="screen mis-sol">
  <header class="mis-sol__header">
    <button type="button" class="mis-sol__back" (click)="back()" aria-label="Atrás">←</button>
    <h1 class="mis-sol__title">Mis requisiciones</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else {
      @for (s of solicitudes(); track s.id) {
        <button type="button" class="sol-card" [attr.data-estado]="s.estado" (click)="abrir(s)">
          <div class="sol-card__top">
            <span class="sol-card__chip">🏗️ {{ s.proyecto?.nombre ?? 'Obra' }}</span>
            <span class="sol-card__estado">{{ estadoLabel(s.estado) }}</span>
          </div>
          <div class="sol-card__meta">
            <span class="sol-card__code">{{ codigo(s.folio) }}</span>
            <span>{{ fmtFecha(s.created_at) }}</span>
            @if (s.urgencia === 'urgente') { <span class="sol-card__urg">🔴 Urgente</span> }
          </div>
          <ul class="sol-card__items">
            @for (it of s.items ?? []; track $index) {
              <li>{{ it.cantidad }} {{ it.unidad }} · {{ it.descripcion }}</li>
            }
          </ul>
          <!-- AY3 — si lo faltante se convirtió en orden de compra, muestra su avance real. -->
          @if (ordenDe(s.id); as oc) {
            <div class="sol-card__orden">
              <span class="sol-card__orden-ico">🧾</span>
              <span class="sol-card__orden-txt">
                Orden {{ oc.numero }} · {{ ordenEstadoLabel(oc.orden_estado) }}@if (oc.proveedor) { · {{ oc.proveedor }} }
              </span>
            </div>
          }
          <span class="sol-card__ver">Ver detalle ›</span>
        </button>
      } @empty {
        <app-empty-state
          icon="📝"
          title="Todavía no has hecho requisiciones"
          message="Cuando necesites materiales para la obra, pídelos aquí. Verás el estado de cada requisición: enviada, aprobada y recibida."
          ctaLabel="Nueva requisición"
          (action)="nueva()"
        />
      }
    }
  </div>
</div>
