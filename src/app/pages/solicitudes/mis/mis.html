<div class="screen mis-sol">
  <header class="mis-sol__header">
    <button type="button" class="mis-sol__back" (click)="back()" aria-label="Atrás">←</button>
    <h1 class="mis-sol__title">{{ 'Mis requisiciones' | t }}</h1>
  </header>

  <!-- BY3 — dos grupos: Activas / Historial -->
  <div class="mis-sol__tabs">
    @for (g of GRUPOS; track g) {
      <button
        type="button"
        class="mis-sol__tab"
        appTapScale
        [class.mis-sol__tab--on]="tab() === g"
        (click)="setTab(g)"
      >
        {{ grupoLabel(g) | t }}
        @if (conteos()[g]) { <span class="mis-sol__tab-n">{{ conteos()[g] }}</span> }
      </button>
    }
  </div>

  <!-- CS1 — orden elegible (solo Activas; Historial sigue fijo por cierre). -->
  @if (tab() === 'activas') {
    <div class="mis-sol__orden" role="group" [attr.aria-label]="'Ordenar por' | t">
      <span class="mis-sol__orden-label">{{ 'Ordenar:' | t }}</span>
      <button type="button" class="mis-sol__tab" appTapScale [class.mis-sol__tab--on]="orden().clave === 'fecha'" (click)="setOrden('fecha')">
        {{ 'Fecha' | t }}@if (orden().clave === 'fecha') { {{ orden().direccion === 'asc' ? '▲' : '▼' }} }
      </button>
      <button type="button" class="mis-sol__tab" appTapScale [class.mis-sol__tab--on]="orden().clave === 'necesidad'" (click)="setOrden('necesidad')">
        {{ 'Necesidad' | t }}@if (orden().clave === 'necesidad') { {{ orden().direccion === 'asc' ? '▲' : '▼' }} }
      </button>
    </div>
  }

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else {
      <div appStagger style="display:contents">
      @for (s of visibles(); track s.id) {
        <button type="button" class="sol-card" appTapScale [attr.data-estado]="s.local ? 'local-' + s.local : s.estado" (click)="abrir(s)">
          <!-- BV10 — la fecha de necesidad es la PRIMERA línea de la tarjeta -->
          @let ni = necesidad(s);
          <div class="sol-card__nec" [class.sol-card__nec--venc]="ni.estado === 'vencida'" [class.sol-card__nec--none]="ni.estado === 'sin_fecha'">
            🗓️
            @switch (ni.estado) {
              @case ('vencida') { <b>{{ 'Necesidad vencida' | t }}</b> }
              @case ('hoy') { <b>{{ 'Se necesita hoy' | t }}</b> }
              @case ('futura') { <b>{{ 'Se necesita en {n} días' | t: { n: ni.dias ?? 0 } }}</b> }
              @case ('sin_fecha') { {{ 'Sin fecha de necesidad' | t }} }
            }
          </div>
          <div class="sol-card__top">
            <span class="sol-card__chip">🏗️ {{ s.proyecto?.nombre ?? ('Obra' | t) }}</span>
            <!-- CT4/CT7 — mientras no hay confirmación del servidor, el estado real
                 es "Enviando…"/"Con problema", no el "Enviada" (pendiente) del server. -->
            @if (s.local === 'enviando') {
              <span class="sol-card__estado sol-card__estado--local">{{ 'Enviando…' | t }}</span>
            } @else if (s.local === 'error') {
              <span class="sol-card__estado sol-card__estado--local-error">{{ 'Con problema' | t }}</span>
            } @else {
              <span class="sol-card__estado" [appEstadoPulse]="s.estado">{{ estadoLabel(s.estado) }}</span>
            }
          </div>
          <div class="sol-card__meta">
            <span class="sol-card__code">{{ s.local ? ('Sin folio aún' | t) : codigo(s.folio) }}</span>
            <span>{{ fmtFecha(s.created_at) }}</span>
            @if (s.urgencia === 'urgente') { <span class="sol-card__urg">🔴 {{ 'Urgente' | t }}</span> }
          </div>
          <ul class="sol-card__items">
            @for (it of s.items ?? []; track $index) {
              <li>{{ it.cantidad }} {{ it.unidad }} · {{ it.descripcion }}</li>
            }
          </ul>
          <!-- AY3 — si lo faltante se convirtió en orden de compra, muestra su avance real. -->
          @if (ordenDe(s.id); as oc) {
            <div class="sol-card__orden">
              <span class="sol-card__orden-ico">🧾</span>
              <span class="sol-card__orden-txt">
                {{ 'Orden' | t }} {{ oc.numero }} · {{ ordenEstadoLabel(oc.orden_estado) }}@if (oc.proveedor) { · {{ oc.proveedor }} }
              </span>
            </div>
          }
          <span class="sol-card__ver">{{ 'Ver detalle' | t }} ›</span>
        </button>
      } @empty {
        <app-empty-state
          icon="📝"
          [title]="(tab() === 'activas' ? 'No tienes requisiciones activas' : 'No hay nada en el historial') | t"
          [message]="'Cuando necesites materiales para la obra, pídelos aquí. Las activas se ordenan por la entrega más cercana; las cerradas pasan al Historial.' | t"
          [ctaLabel]="'Nueva requisición' | t"
          (action)="nueva()"
        />
      }
      </div>
    }
  </div>
</div>
