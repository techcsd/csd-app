<div class="screen bandeja">
  <header class="bandeja__header">
    <button type="button" class="bandeja__back" (click)="back()" aria-label="Atrás">←</button>
    <h1 class="bandeja__title">{{ 'Requisiciones' | t }}</h1>
  </header>

  <div class="bandeja__filtros">
    <input
      class="field bandeja__search"
      type="search"
      [ngModel]="busqueda()"
      (ngModelChange)="onBusqueda($event)"
      [placeholder]="'🔎 ' + ('Buscar por obra, solicitante o artículo' | t)"
    />
    <div class="bandeja__chips">
      @for (e of estados; track e.label) {
        <button type="button" class="bandeja__chip" [class.bandeja__chip--on]="estado() === e.key" (click)="setEstado(e.key)">{{ e.label }}</button>
      }
      <button type="button" class="bandeja__chip bandeja__chip--urg" [class.bandeja__chip--on]="urgencia() === 'urgente'" (click)="toggleUrgente()">🔴 {{ 'Urgentes' | t }}</button>
    </div>
  </div>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else if (noAutorizado()) {
      <app-empty-state icon="🔒" [title]="'Sin acceso' | t" [message]="'No tienes permiso para ver todas las requisiciones.' | t" />
    } @else {
      @for (f of filasVisibles(); track f.id) {
        <button type="button" class="req-card" [attr.data-estado]="f.estado" (click)="abrir(f)">
          <div class="req-card__top">
            <span class="req-card__obra">🏗️ {{ f.proyecto_nombre ?? ('Obra' | t) }}</span>
            <span class="req-card__estado" [attr.data-estado]="f.estado">{{ estadoLabel(f.estado) }}</span>
          </div>
          <div class="req-card__meta">
            <span>{{ fmtFecha(f.created_at) }}</span>
            <span>· {{ f.solicitante_nombre ?? ('Solicitante' | t) }}</span>
            @if (f.urgencia === 'urgente') { <span class="req-card__urg">🔴 {{ 'Urgente' | t }}</span> }
          </div>
          <div class="req-card__foot">
            <span>{{ f.items_count }} {{ (f.items_count === 1 ? 'artículo' : 'artículos') | t }}</span>
            @if (f.tiene_conduce) { <span class="req-card__tag">📦 {{ 'Con conduce' | t }}</span> }
            @if (f.tiene_compra) { <span class="req-card__tag">🛒 {{ 'En compra' | t }}</span> }
            <span class="req-card__chevron" aria-hidden="true">›</span>
          </div>
        </button>
      } @empty {
        <app-empty-state icon="🗂️" [title]="'No hay requisiciones' | t" [message]="'No se encontraron requisiciones con esos filtros.' | t" />
      }
    }
  </div>
</div>
