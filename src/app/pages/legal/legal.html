<div class="screen">
  <header class="hub-header">
    <button type="button" class="hub-header__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="hub-header__icon">⚖️</span>
    <h1 class="hub-header__title">{{ 'Legal' | t }}</h1>
  </header>

  <div class="screen__body">
    <p class="hub-intro">{{ 'Expedientes y contratos de la empresa.' | t }}</p>
    <div class="hub-grid" appStagger>
      <app-big-button appTapScale icon="📁" [label]="'Expedientes' | t" tint="#7c2d12" (pressed)="abrir('/legal/expedientes')" />
      <app-big-button appTapScale icon="📜" [label]="'Contratos' | t" tint="#9a3412" (pressed)="abrir('/legal/contratos')" />
    </div>
  </div>

  <app-sync-bar />
</div>
