<div class="screen his" data-testid="documentos-historial">
  <header class="his__header">
    <button type="button" class="his__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <h1 class="his__title">{{ 'Historial de documentos' | t }}</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="4" />
    } @else if (error()) {
      <app-empty-state [title]="'No pudimos cargar' | t" [message]="'Revisa la conexión y vuelve a intentar.' | t" />
    } @else if (!lista().length) {
      <app-empty-state [title]="'Sin documentos' | t" [message]="'Los documentos que generes aparecen aquí.' | t" />
    } @else {
      <div class="his__lista" appStagger>
        @for (d of lista(); track d.id) {
          <button type="button" class="his__card" appTapScale (click)="abrir(d)">
            <div class="his__card-main">
              <span class="his__card-nom">{{ d.nombre }}</span>
              <span class="his__card-meta">{{ fmtFecha(d.created_at) }} @if (d.plantilla_nombre) { · {{ d.plantilla_nombre }} }</span>
              @if (d.usado_en_contrato; as u) {
                <span class="his__badge">{{ 'Usado en contrato' | t }} {{ u.codigo }}</span>
              }
            </div>
          </button>
        }
      </div>
    }
  </div>

  @if (abierto(); as d) {
    <div class="his__overlay" appFadeIn>
      <header class="his__ficha-header">
        <button type="button" class="his__back" (click)="cerrar()" [attr.aria-label]="'Atrás' | t">←</button>
        <h2 class="his__ficha-title">{{ d.nombre }}</h2>
      </header>
      <div class="his__preview" [innerHTML]="htmlAbierto()"></div>
      <footer class="his__footer">
        <button type="button" class="btn-cta" [disabled]="compartiendo()" (click)="compartir(d)">
          {{ (compartiendo() ? 'Generando PDF…' : 'Compartir por WhatsApp') | t }}
        </button>
      </footer>
    </div>
  }
</div>
