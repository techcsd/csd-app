<div class="screen">
  <header class="hub-header">
    <button type="button" class="hub-header__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="hub-header__icon">📄</span>
    <h1 class="hub-header__title">{{ 'Documentos' | t }}</h1>
  </header>

  <div class="screen__body">
    <p class="hub-intro">{{ 'Genera documentos desde una plantilla, consulta el historial o mira las plantillas disponibles.' | t }}</p>
    <div class="hub-grid" appStagger>
      <app-big-button appTapScale icon="✍️" [label]="'Generar' | t" tint="#334155" (pressed)="abrir('/documentos/generar')" />
      <app-big-button appTapScale icon="🗂️" [label]="'Historial' | t" tint="#475569" (pressed)="abrir('/documentos/historial')" />
      <app-big-button appTapScale icon="📋" [label]="'Plantillas' | t" tint="#52525b" (pressed)="abrir('/documentos/plantillas')" />
    </div>
  </div>

  <app-sync-bar />
</div>
