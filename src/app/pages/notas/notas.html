<div class="screen notas">
  <header class="notas__header">
    <button type="button" class="notas__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="notas__icon">🗒️</span>
    <h1 class="notas__title">Notas</h1>
  </header>

  <div class="screen__body">
    <!-- Tabs: Mis notas / Compartidas conmigo -->
    <div class="notas__tabs">
      <button type="button" class="notas__tab" [class.notas__tab--on]="tab() === 'mias'" (click)="setTab('mias')">
        Mis notas
      </button>
      <button type="button" class="notas__tab" [class.notas__tab--on]="tab() === 'compartidas'" (click)="setTab('compartidas')">
        Compartidas conmigo
      </button>
    </div>

    <!-- Búsqueda -->
    <input
      class="field notas__buscar"
      type="search"
      [ngModel]="busqueda()"
      (ngModelChange)="busqueda.set($event)"
      placeholder="Buscar en tus notas…"
      aria-label="Buscar notas"
    />

    <!-- Ver archivadas (solo en Mis notas) -->
    @if (tab() === 'mias' && (hayArchivadasMias() || verArchivadas())) {
      <button type="button" class="notas__arch-toggle" (click)="verArchivadas.set(!verArchivadas())">
        {{ verArchivadas() ? '← Volver a las activas' : '🗄️ Ver archivadas' }}
      </button>
    }

    @if (loading()) {
      <app-skeleton [rows]="4" />
    } @else if (!filtradas().length) {
      <app-empty-state
        icon="🗒️"
        [title]="tab() === 'mias' ? (verArchivadas() ? 'Sin notas archivadas' : 'No tienes notas') : 'Nadie te ha compartido notas'"
        [message]="tab() === 'mias'
          ? 'Crea una nota para recordar pendientes, listas o ideas. Puedes compartirla después.'
          : 'Cuando alguien te comparta una nota, aparecerá aquí.'"
        [ctaLabel]="tab() === 'mias' && !verArchivadas() ? 'Nueva nota' : ''"
        (action)="nueva()"
      />
    } @else {
      <div class="notas__list">
        @for (n of filtradas(); track n.id) {
          <button
            type="button"
            class="nota-card"
            [style.background]="n.color ?? 'var(--color-surface)'"
            (click)="abrir(n)"
          >
            <div class="nota-card__top">
              @if (n.pinned) { <span class="nota-card__pin">📌</span> }
              <span class="nota-card__titulo">{{ n.titulo || '(Sin título)' }}</span>
            </div>
            @if (snippet(n); as s) { <span class="nota-card__snippet">{{ s }}</span> }
            <div class="nota-card__meta">
              <span>{{ fechaHora(n.updated_at) }}</span>
              @if (n.fallo) {
                <span class="nota-card__badge nota-card__badge--err">⚠️ No se envió</span>
              } @else if (n.enviando) {
                <span class="nota-card__badge nota-card__badge--env">⏳ Enviando…</span>
              } @else if (n.compartida) {
                <span class="nota-card__badge">{{ n.permiso === 'editar' ? '✏️ Puedes editar' : '👁️ Solo lectura' }}</span>
              }
            </div>
          </button>
        }
      </div>
    }
  </div>

  <!-- FAB nueva nota (solo en Mis notas) -->
  @if (tab() === 'mias') {
    <button type="button" class="notas__fab" (click)="nueva()" aria-label="Nueva nota">➕</button>
  }

  <app-sync-bar />
</div>
