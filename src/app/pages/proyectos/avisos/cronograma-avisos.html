<div class="screen cav">
  <header class="cav__header">
    <button type="button" class="cav__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="cav__icon">🔔</span>
    <h1 class="cav__title">{{ 'Avisos de cronograma' | t }}</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else if (!avisos().length) {
      <app-empty-state icon="✅" [title]="'Sin avisos' | t" [message]="online ? ('No hay tareas por iniciar, por vencer ni atrasadas.' | t) : ('Conéctate para ver los avisos.' | t)" />
    } @else {
      @for (a of avisos(); track a.id) {
        <button type="button" class="cav__card cav__card--{{ a.tipo }}" (click)="abrir(a)">
          <div class="cav__top">
            <span class="cav__tag cav__tag--{{ a.tipo }}">{{ (tipoLabel[a.tipo] ?? a.tipo) | t }}</span>
            @if (a.proyecto?.nombre) { <span class="cav__proy">{{ a.proyecto?.nombre }}</span> }
          </div>
          @if (a.mensaje) { <p class="cav__msg">{{ a.mensaje }}</p> }
          <p class="cav__fecha">{{ fmt(a.created_at) }}</p>
        </button>
      }
    }
  </div>
</div>
