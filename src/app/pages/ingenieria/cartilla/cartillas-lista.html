<div class="screen cart-list">
  <header class="cart-list__header">
    <button type="button" class="cart-list__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="cart-list__icon">🧱</span>
    <h1 class="cart-list__title">{{ 'Cartillas' | t }}</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="4" />
    } @else if (error()) {
      <app-empty-state icon="⚠️" [title]="'No pudimos cargar' | t" [message]="'Revisa tu conexión e intenta de nuevo.' | t" />
      <button type="button" class="btn-cta cart-list__retry" (click)="cargar()">{{ 'Reintentar' | t }}</button>
    } @else if (!cartillas().length) {
      <app-empty-state icon="🧱" [title]="'Sin cartillas' | t" [message]="'Aún no has registrado cartillas de acero. Toca el botón para crear la primera.' | t" />
    } @else {
      <label class="field-label" for="cart-buscar">{{ 'Buscar' | t }}</label>
      <input
        id="cart-buscar" class="field cart-list__buscar" type="search"
        [placeholder]="'Buscar por folio u obra…' | t"
        [ngModel]="q()" (ngModelChange)="q.set($event); resetPag()"
      />

      <div appStagger style="display:contents">
      @for (c of visibles(); track c.id) {
        <button type="button" class="cart-list__card" appTapScale (click)="abrir(c)">
          <div class="cart-list__main">
            <span class="cart-list__folio">{{ c.folio }}</span>
            <span class="cart-list__sub">{{ c.proyecto || ('Obra' | t) }} · {{ fmtFecha(c.fecha) }}</span>
            @if (c.peso_total_kg != null) {
              <span class="cart-list__kg">{{ c.peso_total_kg | number:'1.0-1' }} kg</span>
            }
          </div>
          <app-estado-chip [appEstadoPulse]="c.estado" [label]="estadoLabel(c.estado) | t" [tono]="estadoTono(c.estado)" />
        </button>
      } @empty {
        <app-empty-state [title]="'Sin resultados' | t" [message]="'Ninguna cartilla coincide con tu búsqueda.' | t" />
      }
      </div>
      @if (hayMas()) {
        <button type="button" class="btn-ghost cart-list__mas" (click)="cargarMas()">
          {{ 'Cargar más ({n} restantes)' | t: { n: filtradas().length - visibleCount() } }}
        </button>
      }
    }
  </div>

  <button type="button" class="cart-list__fab" (click)="nueva()" [attr.aria-label]="'Nueva cartilla' | t">＋</button>
</div>
