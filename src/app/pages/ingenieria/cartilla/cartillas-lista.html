<div class="screen cart-list">
  <header class="cart-list__header">
    <button type="button" class="cart-list__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="cart-list__icon">🧱</span>
    <h1 class="cart-list__title">Cartillas</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="4" />
    } @else if (error()) {
      <app-empty-state icon="⚠️" title="No pudimos cargar" message="Revisa tu conexión e intenta de nuevo." />
      <button type="button" class="btn-cta cart-list__retry" (click)="cargar()">Reintentar</button>
    } @else if (!cartillas().length) {
      <app-empty-state icon="🧱" title="Sin cartillas" message="Aún no has registrado cartillas de acero. Toca el botón para crear la primera." />
    } @else {
      @for (c of cartillas(); track c.id) {
        <button type="button" class="cart-list__card" (click)="abrir(c)">
          <div class="cart-list__main">
            <span class="cart-list__folio">{{ c.folio }}</span>
            <span class="cart-list__sub">{{ c.proyecto_nombre || 'Obra' }} · {{ fmtFecha(c.fecha) }}</span>
            @if (c.peso_total_kg != null) {
              <span class="cart-list__kg">{{ c.peso_total_kg | number:'1.0-1' }} kg</span>
            }
          </div>
          <span class="cart-list__estado" [attr.data-estado]="c.estado">{{ estadoLabel(c.estado) }}</span>
        </button>
      }
    }
  </div>

  <button type="button" class="cart-list__fab" (click)="nueva()" aria-label="Nueva cartilla">＋</button>
</div>
