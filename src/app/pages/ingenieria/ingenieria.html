<div class="screen">
  <header class="hub-header">
    <button type="button" class="hub-header__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="hub-header__icon">📐</span>
    <h1 class="hub-header__title">{{ 'Ingeniería' | t }}</h1>
  </header>

  <div class="screen__body">
    <p class="hub-intro">{{ 'Herramientas de ingeniería y producción en obra.' | t }}</p>
    <div class="hub-grid">
      @for (t of tiles(); track t.key) {
        <app-big-button
          [icon]="t.icon"
          [label]="t.label | t"
          [tint]="t.tint"
          [badge]="badgeFor(t.key)"
          (pressed)="open(t)"
        />
      }
    </div>
  </div>

  <app-sync-bar />
</div>
