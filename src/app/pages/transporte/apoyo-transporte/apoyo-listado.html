<div class="screen apl" data-testid="apoyo-listado">
  <header class="apl__header">
    <button type="button" class="apl__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <h1 class="apl__title">{{ 'Apoyo de transporte' | t }}</h1>
    <button type="button" class="apl__refresh" (click)="refrescar()" [disabled]="refrescando()" [attr.aria-label]="'Actualizar' | t">{{ refrescando() ? '…' : '↻' }}</button>
  </header>

  <div class="apl__filtros">
    <select class="apl__filtro" [ngModel]="filtroTipo()" (ngModelChange)="aplicarFiltroTipo($event)">
      <option value="">{{ 'Todos los tipos' | t }}</option>
      @for (t of tipos; track t) { <option [value]="t">{{ tipoLabel(t) | t }}</option> }
    </select>
    <select class="apl__filtro" [ngModel]="filtroEstado()" (ngModelChange)="aplicarFiltroEstado($event)">
      <option value="">{{ 'Todos los estados' | t }}</option>
      @for (e of estados; track e) { <option [value]="e">{{ estadoLabel(e) | t }}</option> }
    </select>
  </div>

  <div class="screen__body" appLiveRefresh (appLiveRefresh)="refrescar($event)">
    @if (loading()) {
      <app-skeleton [rows]="3" />
    } @else if (!lista().length) {
      <app-empty-state
        [title]="'Sin apoyos' | t"
        [message]="'Aún no hay apoyos de transporte con estos filtros.' | t"
      />
    } @else {
      @for (s of lista(); track s.id) {
        <button type="button" class="apl__card" [class.apl__card--pend]="s.pendiente" (click)="abrir(s)">
          <div class="apl__card-top">
            <span class="apl__tipo" [attr.data-tipo]="s.tipo_apoyo">{{ tipoLabel(s.tipo_apoyo) | t }}</span>
            @if (s.pendiente) {
              <span class="apl__estado" data-estado="pendiente">{{ 'Pendiente de enviar' | t }}</span>
            } @else {
              <span class="apl__estado" [attr.data-estado]="s.estado">{{ estadoLabel(s.estado) | t }}</span>
            }
          </div>

          <div class="apl__card-main">
            @if (s.foto_url) {
              <img class="apl__thumb" [src]="s.foto_url" alt="" />
            }
            <div class="apl__card-text">
              <p class="apl__desc">{{ s.descripcion }}</p>
              <div class="apl__meta">
                @if (s.proyecto) { <span>{{ s.proyecto }}</span> }
                @if (s.dia) { <span>{{ fmtFecha(s.dia) }}</span> }
                @if (s.solicitante) { <span>{{ s.solicitante }}</span> }
              </div>
            </div>
          </div>
        </button>
      }
    }
  </div>

  <button type="button" class="apl__fab" (click)="crear()" [attr.aria-label]="'Nuevo apoyo' | t">＋</button>
</div>
