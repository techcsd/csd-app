<div class="screen cel">
  <header class="cel__header">
    <button type="button" class="cel__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="cel__icon">🚚</span>
    <h1 class="cel__title">{{ 'Mis conduces externos' | t }}</h1>
    <button type="button" class="cel__add" (click)="nuevo()" [attr.aria-label]="'Nuevo' | t">➕</button>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="6" />
    } @else if (fallo()) {
      <app-empty-state
        icon="⚠️"
        [title]="'No pudimos cargar' | t"
        [message]="'Revisa tu conexión e intenta de nuevo.' | t"
      />
      <button type="button" class="btn-cta cel__retry" (click)="load()">{{ 'Reintentar' | t }}</button>
    } @else if (!rows().length) {
      <app-empty-state
        icon="🚚"
        [title]="'Sin conduces externos' | t"
        [message]="'Cuando registres un conduce externo aparecerá aquí con su número y PDF.' | t"
      />
    } @else {
      @for (r of rows(); track r.id) {
        <button type="button" class="cel-card" [class.cel-card--pend]="r.pendiente" (click)="abrir(r)">
          <div class="cel-card__top">
            <span class="cel-card__codigo">{{ r.codigo }}</span>
            <span class="cel-card__estado" [class.cel-card__estado--pend]="r.pendiente">{{ estadoLabel(r) }}</span>
          </div>
          <div class="cel-card__transporta">🚛 {{ r.transporta || ('Proveedor' | t) }}</div>
          <div class="cel-card__ruta">{{ r.origen || '—' }} → {{ r.destino || '—' }}</div>
          @if (r.material) { <div class="cel-card__material">{{ r.material }}</div> }
          @if (r.created_at) { <div class="cel-card__fecha">{{ fmt(r.created_at) }}</div> }
        </button>
      }
    }
  </div>
</div>
