<div class="screen clist">
  <header class="clist__header">
    <button type="button" class="clist__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="clist__icon">🪪</span>
    <h1 class="clist__title">Conductores</h1>
  </header>

  <div class="screen__body">
    @if (esAdmin()) {
      <button type="button" class="btn-cta clist__add" (click)="nuevo()">➕ Agregar conductor</button>
    }

    <input
      class="field clist__search"
      type="text"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      placeholder="Buscar por nombre o cédula…"
    />

    <!-- C7 — filtro rápido: solo conductores con documentos incompletos -->
    <button
      type="button"
      class="clist__filter"
      [class.clist__filter--on]="soloIncompletos()"
      (click)="soloIncompletos.set(!soloIncompletos())"
    >
      📄 Solo documentos incompletos
    </button>

    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else if (error()) {
      <!-- BL2 — la consulta falló y no hay nada cacheado: error+reintento -->
      <app-empty-state
        icon="⚠️"
        title="No pudimos cargar los conductores"
        message="Hubo un problema al consultar la lista. Revisa tu conexión y reintenta."
        ctaLabel="Reintentar"
        (action)="reintentar()"
      />
    } @else if (!lista().length) {
      <!-- BL2 — "sin resultados de búsqueda" se conserva; el vacío total se
           suaviza para no afirmar una causa que no probamos. -->
      <app-empty-state
        icon="🪪"
        title="Sin conductores"
        [message]="query() ? 'Ningún conductor coincide con tu búsqueda.' : 'No vemos conductores para mostrarte. Si esperabas alguno, agrégalo o consulta con Flota.'"
      />
    } @else {
      @for (c of lista(); track c.id) {
        <button type="button" class="clist__row" (click)="ver(c)">
          <span class="clist__avatar">{{ (c.nombre || '?').charAt(0) }}</span>
          <span class="clist__info">
            <span class="clist__name">{{ c.nombre }}</span>
            @if (c.cedula) { <span class="clist__ced">{{ c.cedula | cedula }}</span> }
            <span
              class="clist__lic"
              [class.clist__lic--warn]="licEstado(c) === 'por_vencer'"
              [class.clist__lic--bad]="licEstado(c) === 'vencida'"
            >{{ licLabel(c) }}</span>
            @if (docsIncompletos(c)) {
              <span class="clist__docbadge">📄 Documentos incompletos</span>
            }
          </span>
          <span class="clist__chev">›</span>
        </button>
      }
    }
  </div>
</div>
