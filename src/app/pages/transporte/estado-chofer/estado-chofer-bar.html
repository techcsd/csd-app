<!-- AF28 — barra de estado del chofer -->
<button type="button" class="estado-bar" [style.--tint]="meta().tint" (click)="abrir()">
  <span class="estado-bar__dot">{{ meta().icon }}</span>
  <span class="estado-bar__txt">
    <span class="estado-bar__label">{{ meta().label }}</span>
    @if (estado() === 'otros' && otrosTexto()) {
      <span class="estado-bar__sub">{{ otrosTexto() }}</span>
    } @else if (estado() === 'almuerzo' && countdown()) {
      <span class="estado-bar__sub">Vuelve en {{ countdown() }}</span>
    }
  </span>
  <span class="estado-bar__cambiar">Cambiar</span>
</button>

<app-bottom-sheet [open]="sheetOpen()" titulo="¿Cómo estás ahora?" (closed)="cerrar()">
  @if (!pidiendoOtros()) {
    <div class="estado-opts">
      @for (o of opciones; track o.key) {
        <app-option-button
          [icon]="o.icon"
          [label]="o.label"
          [selected]="estado() === o.key"
          (pressed)="elegir(o.key)"
        />
      }
    </div>
  } @else {
    <div class="estado-otros">
      <label class="estado-otros__lbl" for="estado-otros-input">¿Qué estás haciendo?</label>
      <input
        id="estado-otros-input"
        class="estado-otros__input"
        type="text"
        maxlength="80"
        placeholder="Ej. Cargando combustible…"
        [ngModel]="otrosInput()"
        (ngModelChange)="otrosInput.set($event)"
      />
      <button type="button" class="btn-cta" (click)="confirmarOtros()">Guardar estado</button>
    </div>
  }
</app-bottom-sheet>
