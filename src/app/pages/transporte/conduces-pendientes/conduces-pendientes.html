<div class="screen cpend">
  <header class="cpend__header">
    <button type="button" class="cpend__back" (click)="back()" aria-label="Atrás">←</button>
    <span class="cpend__icon">🚚</span>
    <h1 class="cpend__title">Pendiente entrega</h1>
  </header>

  <div class="screen__body">
    @if (loading()) {
      <app-skeleton [rows]="4" />
    } @else if (!pendientes().length) {
      <app-empty-state
        icon="✅"
        title="Nada por entregar"
        message="Cuando emitas un conduce aparecerá aquí hasta que lo entregues al receptor."
      />
    } @else {
      @for (c of pendientes(); track c.id) {
        <div class="cpend__card">
          <div class="cpend__info">
            <span class="cpend__destino">🏗️ {{ c.destino || 'Destino' }}</span>
            <span class="cpend__meta">
              @if (c.bodega) { {{ c.bodega }} · } {{ fmtFecha(c.fecha) }}
            </span>
          </div>
          <div class="cpend__actions">
            <button type="button" class="btn-cta cpend__btn" (click)="entregar(c.id)">📤 Entregar</button>
            <button type="button" class="btn-ghost cpend__btn" (click)="abrirTransferir(c.id)">↔️ Transferir</button>
          </div>

          @if (transfiriendoId() === c.id) {
            <div class="cpend__transfer">
              <app-collapsible-select
                label="Transferir a"
                icon="🧑‍✈️"
                [options]="choferOptions()"
                [selectedId]="transferConductor()"
                [searchable]="true"
                searchPlaceholder="Buscar chofer…"
                (picked)="transferConductor.set($event)"
              />
              <input class="field cpend__nota" type="text" [ngModel]="transferNota()" (ngModelChange)="transferNota.set($event)" placeholder="Nota (opcional)" />
              <button
                type="button"
                class="btn-cta cpend__btn"
                [disabled]="enviandoTransfer() || !transferConductor()"
                (click)="confirmarTransferir(c.id)"
              >{{ enviandoTransfer() ? 'Enviando…' : 'Confirmar transferencia' }}</button>
            </div>
          }
        </div>
      }
    }
  </div>
</div>
