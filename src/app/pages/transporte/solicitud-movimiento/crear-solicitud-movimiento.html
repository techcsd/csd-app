<div class="screen csolm">
  <header class="csolm__header">
    <button type="button" class="csolm__back" (click)="back()" aria-label="Atrás">←</button>
    <h1 class="csolm__title">{{ 'Nueva solicitud de movimiento' | t }}</h1>
  </header>

  <div class="screen__body csolm__body">
    <label class="field-label">{{ 'Obra' | t }} <span class="csolm__req">*</span></label>
    <app-collapsible-select
      icon="🏗️"
      [label]="'Obra' | t"
      [options]="obraOpts()"
      [selectedId]="proyectoId()"
      [placeholder]="'Elige la obra' | t"
      [searchable]="true"
      (picked)="proyectoId.set($event)"
    />

    <label class="field-label">{{ '¿Qué se mueve?' | t }} <span class="csolm__req">*</span></label>
    @for (r of renglones(); track $index) {
      <div class="csolm__renglon">
        @if (r.noCat) {
          <input
            class="field csolm__ren-desc"
            type="text"
            [ngModel]="r.descripcion"
            (ngModelChange)="setRenglon($index, 'descripcion', $event)"
            [placeholder]="'Describe el artículo (no catalogado)' | t"
          />
        } @else {
          <app-collapsible-select
            [label]="'Artículo' | t"
            [options]="articuloOpts()"
            [selectedId]="r.articuloId"
            [placeholder]="'Elige del catálogo' | t"
            [searchable]="true"
            (picked)="pickArticulo($index, $event)"
          />
        }
        <div class="csolm__ren-row">
          <input class="field csolm__ren-cant" type="number" inputmode="decimal" min="0"
            [ngModel]="r.cantidad" (ngModelChange)="setCantidad($index, $event)" [placeholder]="'Cant.' | t" />
          <input class="field csolm__ren-und" type="text"
            [ngModel]="r.unidad" (ngModelChange)="setRenglon($index, 'unidad', $event)" [placeholder]="'Unidad' | t" />
          <button type="button" class="csolm__ren-nocat" (click)="toggleNoCat($index)">
            {{ r.noCat ? ('Del catálogo' | t) : ('No está en el catálogo' | t) }}
          </button>
          @if (renglones().length > 1) {
            <button type="button" class="csolm__ren-del" (click)="quitarRenglon($index)" aria-label="Quitar">✕</button>
          }
        </div>
      </div>
    }
    <button type="button" class="csolm__add" (click)="agregarRenglon()">+ {{ 'Agregar artículo' | t }}</button>

    <label class="field-label">{{ 'Dirección del movimiento' | t }}</label>
    <div class="csolm__opts">
      @for (d of direcciones; track d.key) {
        <app-option-button [label]="d.label | t" [selected]="direccion() === d.key" (pressed)="direccion.set(d.key)" />
      }
    </div>

    <label class="field-label">{{ otroLabel() }}</label>
    @if (!otroEsTexto()) {
      <app-collapsible-select
        [label]="'Almacén' | t"
        [options]="bodegaOpts()"
        [selectedId]="otroBodegaId()"
        [placeholder]="'Elige el almacén (Central primero)' | t"
        [searchable]="true"
        (picked)="otroBodegaId.set($event)"
      />
      <button type="button" class="csolm__otro-toggle" (click)="otroEsTexto.set(true)">
        {{ 'Es otro lugar (proveedor, etc.)' | t }}
      </button>
    } @else {
      <input
        class="field"
        type="text"
        [ngModel]="otroPunto()"
        (ngModelChange)="otroPunto.set($event)"
        [placeholder]="'Ej: proveedor Ferretería X…' | t"
      />
      <button type="button" class="csolm__otro-toggle" (click)="otroEsTexto.set(false)">
        {{ 'Elegir un almacén' | t }}
      </button>
    }

    <label class="field-label">{{ 'Tipo de carga' | t }}</label>
    <div class="csolm__opts">
      @for (t of tipos; track t.key) {
        <app-option-button [label]="t.label | t" [selected]="tipoCarga() === t.key" (pressed)="tipoCarga.set(t.key)" />
      }
    </div>

    <label class="field-label">{{ 'Prioridad' | t }}</label>
    <div class="csolm__opts">
      @for (p of prioridades; track p.key) {
        <app-option-button
          [label]="p.label | t"
          [selected]="prioridad() === p.key"
          [tone]="p.tone"
          (pressed)="prioridad.set(p.key)"
        />
      }
    </div>

    <label class="field-label">{{ '¿Para cuándo lo necesitas en obra?' | t }}</label>
    <input class="field" type="date" [ngModel]="fechaReq()" (ngModelChange)="fechaReq.set($event)" />

    <label class="field-label">{{ 'Notas (opcional)' | t }}</label>
    <textarea
      class="field csolm__notas"
      [ngModel]="notas()"
      (ngModelChange)="notas.set($event)"
      rows="3"
      [placeholder]="'Detalles útiles para transporte…' | t"
    ></textarea>
  </div>

  <app-wizard-footer
    [backLabel]="'Cancelar' | t"
    [primaryLabel]="'Enviar solicitud' | t"
    [primaryDisabled]="!puedeEnviar()"
    (back)="back()"
    (primary)="enviar()"
  />
</div>
