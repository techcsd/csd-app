<div class="screen aparam">
  <header class="aparam__header">
    <button type="button" class="aparam__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <span class="aparam__icon">⚙️</span>
    <h1 class="aparam__title">{{ 'Parámetros' | t }}</h1>
  </header>

  <div class="screen__body">
    <input class="field aparam__buscar" type="search" [ngModel]="busqueda()" (ngModelChange)="busqueda.set($event)" [attr.placeholder]="'Buscar parámetro…' | t" />

    @if (loading()) {
      <app-skeleton [rows]="6" />
    } @else if (!filtrados().length) {
      <app-empty-state icon="⚙️" [title]="'Sin parámetros' | t" [message]="'No hay parámetros que coincidan.' | t" />
    } @else {
      @for (p of filtrados(); track p.clave) {
        <div class="aparam-card">
          <span class="aparam-card__clave">{{ p.clave }}</span>
          @if (p.descripcion) { <span class="aparam-card__desc">{{ p.descripcion }}</span> }
          <div class="aparam-card__edit">
            <input class="field" type="text" [ngModel]="valores()[p.clave]" (ngModelChange)="setValor(p.clave, $event)" />
            @if (cambiado(p)) {
              <button type="button" class="btn-cta aparam-card__save" [disabled]="guardando() === p.clave" (click)="guardar(p)">
                {{ guardando() === p.clave ? '…' : ('Guardar' | t) }}
              </button>
            }
          </div>
        </div>
      }
    }
  </div>
</div>
