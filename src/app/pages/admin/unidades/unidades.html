<div class="screen adm-sub">
  <header class="adm-sub__header">
    <button type="button" class="adm-sub__back" (click)="back()" [attr.aria-label]="'Atrás' | t">←</button>
    <h1 class="adm-sub__title">{{ 'Unidades' | t }}</h1>
  </header>

  <div class="screen__body">
    <div class="adm-add">
      <input class="field" type="text" [ngModel]="nuevo()" (ngModelChange)="nuevo.set($event)" (keyup.enter)="agregar()" [placeholder]="'Nueva unidad (ej: Cubeta)' | t" />
      <button type="button" class="btn-cta" [disabled]="saving()" (click)="agregar()">{{ 'Agregar' | t }}</button>
    </div>

    @if (loading()) {
      <app-skeleton [rows]="5" />
    } @else {
      @for (u of unidades(); track u.id) {
        <div class="cat-row" [class.cat-row--off]="!u.activo">
          <div class="cat-row__info">
            <span class="cat-row__name">{{ u.nombre }}</span>
            <span class="cat-row__code">{{ u.codigo }}</span>
          </div>
          <button type="button" class="cat-row__btn" (click)="toggle(u)">
            {{ (u.activo ? 'Desactivar' : 'Activar') | t }}
          </button>
        </div>
      }
    }
  </div>
</div>
