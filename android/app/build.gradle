apply plugin: 'com.android.application'

// Load release signing config from android/keystore.properties (gitignored).
// If it's absent (e.g. a fresh clone), release builds fall back to unsigned.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// V5: single source of truth for the version. versionCode is DERIVED from the
// name (major*1_000_000 + minor*1_000 + patch) so it always increments with the
// version and matches the backend's version_code scheme (e.g. 1.5.0 -> 1005000).
// Keep appVersionName in sync with src/environments/* and scripts/release-apk.mjs.
def appVersionName = "2.28.0"
def computeVersionCode = { String name ->
    def p = name.tokenize('.')
    def major = (p.size() > 0 ? p[0] : "0").toInteger()
    def minor = (p.size() > 1 ? p[1] : "0").toInteger()
    def patch = (p.size() > 2 ? p[2] : "0").toInteger()
    return major * 1000000 + minor * 1000 + patch
}

android {
    namespace = "com.constructorasd.csdapp"
    // BU1 F2 — dos flavors por entorno: `prod` y `dev`. El dev instala JUNTO al de
    // prod (applicationId distinto `…​.dev`), muestra "CSD App DEV" (strings.xml del
    // flavor en src/dev/res) e icono con banda DEV (src/dev/res/mipmap-*). Misma
    // keystore (interno). El nombre app_name/custom_url_scheme se sobreescriben en
    // el strings.xml del flavor dev (evita el conflicto de recurso de resValue).
    flavorDimensions "entorno"
    productFlavors {
        prod {
            dimension "entorno"
        }
        dev {
            dimension "entorno"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Firmamos con v1 + v2 + v3. v1 (JAR) no es estrictamente
                // necesario con minSdk 24, PERO algunos instaladores de OEM
                // (MIUI/Xiaomi, Android viejo) rechazan con "Aplicación no
                // instalada" un APK que solo trae v2/v3. Reactivarlo es aditivo
                // (misma keystore, mismo cert) y maximiza la compatibilidad de
                // instalación/actualización en la flota de campo.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    defaultConfig {
        applicationId "com.constructorasd.csdapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computeVersionCode(appVersionName)
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // AL6-fix — CsdMessagingService extiende el servicio FCM de Capacitor; el módulo
    // app necesita firebase-messaging en su classpath (el plugin de push lo declara
    // como implementation y no lo expone). Misma versión que @capacitor/push-notifications.
    def fcmVersion = rootProject.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'
    implementation "com.google.firebase:firebase-messaging:$fcmVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// BU1 F2 — google-services es FLAVOR-AWARE. El flavor dev usa el applicationId
// `com.constructorasd.csdapp.dev`; si NO existe un google-services.json propio de dev
// (src/dev/google-services.json — app Android dev en Firebase, pendiente de Xaviel),
// aplicar el plugin ROMPERÍA el build ("No matching client for package …dev"). Por eso,
// para builds dev sin ese JSON, NO se aplica el plugin: el APK dev compila SIN push
// (PushService lo detecta y lo dice en "Acerca de"). Cuando Xaviel agregue
// src/dev/google-services.json, el plugin lo toma solo (ubicación por flavor) y hay push.
try {
    def isDevBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('dev') }
    def devServices = file('src/dev/google-services.json')
    def servicesJSON = file('google-services.json')
    def applyGoogle = servicesJSON.exists() && servicesJSON.text
    if (isDevBuild && !devServices.exists()) {
        applyGoogle = false
        logger.warn("Flavor dev sin src/dev/google-services.json → APK dev SIN push (esperado hasta crear la app Firebase .dev).")
    }
    if (applyGoogle) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
